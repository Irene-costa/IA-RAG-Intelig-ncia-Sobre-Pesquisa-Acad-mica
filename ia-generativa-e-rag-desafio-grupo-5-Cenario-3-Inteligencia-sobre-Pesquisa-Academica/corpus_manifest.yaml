# As quatro bases declaradas, com natureza, fonte e tipo de acesso.
# Não precisa estar completo em endpoints e parâmetros hoje. Precisa existir, com as quatro bases nomeadas e a seleção pensada.
bases:
  - base_id: editais_normativo
    natureza: normativa
    fonte: "https://exemplo.com/editais"
    tipo_acesso: publico
    arquivos:
      - edital_01.pdf

  - base_id: dados_estruturado
    natureza: estruturada
    fonte: "https://exemplo.com/dados"
    tipo_acesso: interno
    arquivos:
      - tabela_precos.json

  - base_id: faq_conversacional
    natureza: conversacional
    fonte: "https://exemplo.com/faq"
    tipo_acesso: publico
    arquivos:
      - faq.json

  - base_id: relatorios_agregada
    natureza: agregada
    fonte: "https://exemplo.com/relatorios"
    tipo_acesso: restrito
    arquivos:
      - relatorio.txt